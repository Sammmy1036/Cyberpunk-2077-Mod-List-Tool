<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberpunk 2077 Mod List Tool: interactive demo</title>
<style>
/* Cyberpunk 2077 Mod List Tool — UI
   Tokens: graphite is the header surface with white type, yellow marks the active/primary action, cyan marks state, red is for faults only. */
:root {
  --yellow: #FCEE0A;
  --yellow-deep: #D9CC00;
  --black: #000;
  --bone: #E9E8DF;
  --bone-dim: #9A998F;
  --cyan: #13E2F5;
  --red: #FF2E4C;
  --green: #2BE38A;
  --orange: #FF9A1F;
  --graphite: #26272B;
  --graphite-2: #17181B;
  --charcoal: #18181B;   /* poster background */
  --surface: #0B0B0D;
  --slab: #26272C;       /* header + splash card: dark graphite with white type */    /* panels sit on this so content stays clean */
  --c: 14px; /* chamfer size */
  --font: "Bahnschrift", "DIN Alternate", "D-DIN", "Arial Narrow", "Segoe UI", sans-serif;
  --font-cond: "Bahnschrift Condensed", "Bahnschrift", "DIN Condensed", "Arial Narrow", sans-serif;
  --mono: "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--black); color: var(--bone); }
body { font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--cyan); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
::selection { background: var(--yellow); color: var(--black); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--graphite); border: 3px solid var(--black); }
::-webkit-scrollbar-thumb:hover { background: var(--yellow-deep); }
::-webkit-scrollbar-track { background: transparent; }

.app { display: grid; grid-template-columns: 232px 1fr; grid-template-rows: 1fr auto; height: 100vh; }

/* ---------------------------------------------------------------- rail */
.rail { grid-row: 1 / 2; display: flex; flex-direction: column; padding: 14px 0 16px; border-right: 1px solid var(--graphite); background: var(--black); min-height: 0; }
/* Nexus account chip (all pages) */
.user-chip { --edge: var(--graphite); display: flex; align-items: center; gap: 10px; margin: 0 14px 18px; padding: 6px 10px 6px 6px; text-align: left; cursor: pointer;
  /* redraw the border along the cut corner (clip-path removes it), like the buttons */
  background: linear-gradient(to top right, transparent calc(50% - 1px), var(--edge) calc(50% - 1px) calc(50% + .5px), transparent calc(50% + .5px)) top right / 10px 10px no-repeat, var(--surface); border: 1px solid var(--edge); color: var(--bone);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
.user-chip:hover { --edge: var(--yellow); }
.user-chip img, .user-chip .ph { width: 32px; height: 32px; flex: none; object-fit: cover; background: var(--graphite);
  clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%); }
.user-chip .ph { display: grid; place-items: center; font-family: var(--font-cond); font-size: 17px; color: var(--yellow); }
.user-chip span { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.user-chip b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-chip small { font-size: 11.5px; color: var(--bone-dim); }
.user-chip small.prem { color: var(--yellow); }
.user-chip.off { color: var(--bone-dim); }
.user-chip.off small { color: var(--cyan); }
.user-chip .dot { width: 7px; height: 7px; margin-left: auto; flex: none; background: var(--cyan); }
.user-chip.off .dot { background: var(--graphite); }
.nav { position: relative; display: flex; justify-content: space-between; align-items: center; margin: 2px 12px 2px 0; padding: 11px 16px 11px 20px;
  background: none; border: 0; text-align: left; cursor: pointer; color: var(--bone-dim); font-size: 15px;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
.nav:hover { color: var(--bone); background: var(--graphite-2); }
.nav.active { background: var(--yellow); color: var(--black); font-weight: 600; }
.nav.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cyan); }
.nav em { font-style: normal; font-size: 12px; min-width: 22px; text-align: center; padding: 1px 6px; }
.nav em:empty { display: none; }
.nav em.bad { background: var(--red); color: var(--black); }
.nav em.info { border: 1px solid currentColor; }
/* Sidebar circuit art: drawn at its natural size (never scaled), pinned above the Launch button.
   Extra height is filled by continuing its vertical traces upward, so any window size looks right. */
.rail { --trace: var(--yellow); }
.rail:has(.launch.running), .rail:has(.launch.launching) { --trace: var(--cyan); }
.rail:has(.launch:disabled:not(.running):not(.launching)) { --trace: #3A3B40; }
.rail-spacer { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-height: 40px; margin-top: 10px; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 140px); mask-image: linear-gradient(to bottom, transparent 0, #000 140px); }
.rail-spacer::before { content: ""; flex: 1 1 auto; min-height: 0;
  background:
    linear-gradient(var(--trace), var(--trace)) 168.5px 0 / 3px 100% no-repeat,
    linear-gradient(#3A3B40, #3A3B40) 182px 0 / 1px 100% no-repeat,
    linear-gradient(#3A3B40, #3A3B40) 200px 0 / 1px 100% no-repeat,
    linear-gradient(#2E2F34, #2E2F34) 44px 0 / 1px 100% no-repeat,
    linear-gradient(#2E2F34, #2E2F34) 28px 0 / 1px 100% no-repeat; }
.rail-spacer .circuit { flex: none; display: block; width: 228px; height: 300px; }
.rail-spacer .circuit .live-trace { stroke: var(--trace); }
.launch { --edge: var(--yellow); position: relative; margin: 0 14px; display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 9px;
  cursor: pointer; text-align: left; color: var(--bone); border: 1px solid var(--edge);
  background: linear-gradient(to top left, transparent calc(50% - 1px), var(--edge) calc(50% - 1px) calc(50% + .5px), transparent calc(50% + .5px)) bottom right / 16px 16px no-repeat, var(--black);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%); }
.launch .gicon { flex: none; width: 48px; height: 48px; display: grid; place-items: center; background: var(--yellow); color: var(--black);
  clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%); }
.launch .gicon img { width: 44px; height: 44px; object-fit: cover; image-rendering: auto;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); }
.launch .gicon svg { width: 34px; height: 34px; }
.launch .ltxt { display: flex; flex-direction: column; min-width: 0; }
.launch b { font-family: var(--font-cond); font-size: 18px; line-height: 1.1; white-space: nowrap; }
.launch small { color: var(--bone-dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.launch:hover:not(:disabled) { background-color: var(--yellow); color: var(--black); }
.launch:hover:not(:disabled) small { color: var(--black); }
.launch:hover:not(:disabled) .gicon { background: var(--black); }
.launch:disabled { --edge: var(--graphite); cursor: default; }
.launch:disabled .gicon { filter: grayscale(1) brightness(.7); }
.launch.running small, .launch.launching small { color: var(--cyan); }
.launch.running, .launch.launching { --edge: var(--cyan); }
.launch.launching .gicon { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* ---------------------------------------------------------------- slab header */
.main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: repeating-linear-gradient(-55deg, rgba(255,255,255,.022) 0 70px, transparent 70px 170px), var(--charcoal); }
.slab, .page { position: relative; z-index: 1; }
.slab { position: relative; flex: none; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  margin: 14px 18px 0 18px; padding: 22px 34px 20px 28px; min-height: 118px; background: var(--slab); color: #fff;
  clip-path: polygon(0 0, calc(100% - 46px) 0, 100% 46px, 100% 100%, 64px 100%, 46px calc(100% - 18px), 0 calc(100% - 18px)); }
.slab::after { /* inner hairline like the reference art */
  content: ""; position: absolute; inset: 9px 10px 26px 10px; border-top: 1px solid rgba(255,255,255,.28); border-right: 1px solid rgba(255,255,255,.28);
  clip-path: polygon(0 0, calc(100% - 40px) 0, 100% 40px, 100% 100%, 0 100%); pointer-events: none; }
.slab-brand { display: flex; align-items: flex-end; gap: 26px; min-width: 0; }
.slab-logo { flex: none; display: flex; flex-direction: column; align-items: stretch; width: 290px; }
/* the logo PNG is turned into a cut-out (brightness -> alpha) in app.js, then used as a mask so it
   prints in black on the yellow slab with no background box */
.slab-logo .mark { display: block; width: 100%; aspect-ratio: var(--logo-ratio, 430 / 108); max-height: 92px; background: #fff;
  -webkit-mask: var(--logo) left top / 100% 100% no-repeat; mask: var(--logo) left top / 100% 100% no-repeat; }
.slab-logo .tool { margin-top: 2px; font-family: var(--font-cond); font-weight: 700; font-size: 18px; text-transform: uppercase;
  letter-spacing: .5em; text-indent: .5em; text-align: center; }
.slab-logo.text-only .mark { display: none; }
.slab-logo.no-sub .tool { display: none; }
.slab-logo .mark { -webkit-mask-size: contain; mask-size: contain; -webkit-mask-position: center; mask-position: center; }
.slab-logo.text-only .tool { font-size: 30px; letter-spacing: .12em; text-align: left; text-indent: 0; }
.slab-title { padding-left: 26px; border-left: 2px solid rgba(255,255,255,.85); min-width: 0; }
.slab h1 { margin: 0; font-family: var(--font-cond); font-weight: 700; font-size: 38px; line-height: .95; text-transform: uppercase; letter-spacing: .01em; white-space: nowrap; }
.slab p { margin: 6px 0 0; font-size: 13.5px; max-width: 52ch; }
@media (max-width: 1280px) { .slab-logo { width: 230px; } .slab h1 { font-size: 32px; } }
.slab-meta { position: relative; display: flex; gap: 26px; text-align: right; font-size: 12px; padding-bottom: 6px; flex: none; }
.slab-meta:empty::after { display: none; }
.slab-meta div b { display: block; font-family: var(--font-cond); font-size: 24px; line-height: 1; }
.slab-stripe { position: absolute; left: 0; bottom: 0; width: 46px; height: 18px; background: var(--black); }

/* ---------------------------------------------------------------- page */
.page { flex: 1; min-height: 0; overflow: auto; padding: 20px 18px 24px; }
.grid { display: grid; gap: 18px; }
.cols-2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1250px) { .cols-2, .cols-3 { grid-template-columns: 1fr; } }

.panel { position: relative; border: 1px solid var(--graphite); padding: 18px 20px; min-width: 0; background: var(--surface);
  clip-path: polygon(0 0, calc(100% - var(--c)) 0, 100% var(--c), 100% 100%, 0 100%); }
.panel::before { /* redraw the chamfer edge in the border colour so the outline stays closed */
  content: ""; position: absolute; right: 0; top: 0; width: var(--c); height: var(--c); pointer-events: none;
  background: linear-gradient(to top right, transparent calc(50% - 1px), var(--graphite) calc(50% - 1px) calc(50% + .5px), transparent calc(50% + .5px)); }
.panel h2 { margin: 0 0 12px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.panel h2::before { content: ""; flex: none; width: 22px; height: 10px;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 3px, transparent 3px 6px); transform: skewX(-20deg); }
.panel h2 .hint { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--bone-dim); }
.muted { color: var(--bone-dim); }
.hatch { background: repeating-linear-gradient(135deg, transparent 0 7px, rgba(233,232,223,.06) 7px 8px); }

/* readout (overview) */
.readout { display: grid; grid-template-columns: auto 1fr; gap: 6px 34px; align-items: end; }
.bignum { font-family: var(--font-cond); font-weight: 700; font-size: 132px; line-height: .8; color: var(--yellow); letter-spacing: -.03em; }
.readout dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 0; font-size: 14px; }
.readout dt { color: var(--bone-dim); }
.readout dd { margin: 0; }
.bar { display: flex; height: 6px; margin-top: 18px; gap: 2px; }
.bar i { display: block; height: 100%; }

.alerts { list-style: none; margin: 0; padding: 0; }
.alerts li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--graphite); }
.alerts li:first-child { border-top: 0; }
.alerts .dot { flex: none; width: 11px; height: 11px; margin-top: 5px; background: var(--cyan); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.alerts .lvl-ok .dot { background: var(--green); }
.alerts .lvl-warn .dot { background: var(--orange); }
.alerts .lvl-bad .dot { background: var(--red); }
.alerts .lvl-none .dot { background: var(--bone-dim); }
.alerts .act { margin-left: auto; flex: none; }

/* ---------------------------------------------------------------- controls */
.btn { --edge: var(--bone-dim); display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--edge); padding: 8px 14px; cursor: pointer;
  background: linear-gradient(to top right, transparent calc(50% - 1px), var(--edge) calc(50% - 1px) calc(50% + .5px), transparent calc(50% + .5px)) top right / 8px 8px no-repeat;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); white-space: nowrap; }
.btn:hover { --edge: var(--bone); background-color: var(--graphite-2); }
.btn.primary { background: var(--yellow); color: var(--black); border-color: var(--yellow); font-weight: 600; }
.btn.primary:hover { background: var(--bone); border-color: var(--bone); }
.btn.cyan { --edge: var(--cyan); color: var(--cyan); }
.btn.danger { --edge: var(--red); color: var(--red); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.link { background: none; border: 0; padding: 0; color: var(--cyan); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

input[type=text], input[type=password], input[type=search], select {
  background: var(--graphite-2); border: 1px solid var(--graphite); padding: 8px 12px; color: var(--bone); min-width: 0; }
input:focus, select:focus { border-color: var(--yellow); outline: none; }
.check { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 0; }
.check input { appearance: none; width: 16px; height: 16px; margin: 0; border: 1px solid var(--bone-dim); display: grid; place-items: center; flex: none; cursor: pointer; }
.check input:checked { background: var(--yellow); border-color: var(--yellow); }
.check input:checked::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--black); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }

.seg { display: inline-flex; border: 1px solid var(--graphite); }
.seg button { background: none; border: 0; padding: 7px 13px; color: var(--bone-dim); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--graphite); }
.seg button.on { background: var(--bone); color: var(--black); }
.seg button em { font-style: normal; opacity: .65; margin-left: 4px; }

/* angular toggle switch */
.switch { appearance: none; width: 42px; height: 20px; margin: 0; position: relative; cursor: pointer; flex: none;
  background: var(--graphite); clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 14px; background: var(--bone-dim); transition: left .12s; }
.switch:checked { background: var(--yellow); }
.switch:checked::after { left: 23px; background: var(--black); }
.switch:disabled { opacity: .45; cursor: not-allowed; }
.switch.partial { background: repeating-linear-gradient(135deg, var(--yellow) 0 4px, var(--graphite) 4px 8px); }

/* ---------------------------------------------------------------- mods table */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.toolbar .search { flex: 1 1 220px; display: flex; }
.toolbar .search input { flex: 1; padding-left: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.subbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.chip { border: 1px solid var(--graphite); background: none; padding: 3px 10px; font-size: 12px; color: var(--bone-dim); cursor: pointer; }
.chip.on { border-color: var(--cyan); color: var(--cyan); }
.table { width: 100%; border-collapse: collapse; }
.table th { position: sticky; top: -20px; background: var(--charcoal); z-index: 1; text-align: left; font-weight: 400; color: var(--bone-dim); font-size: 12px;
  padding: 8px 10px; border-bottom: 1px solid var(--bone-dim); cursor: pointer; user-select: none; }
.table th.sorted { color: var(--yellow); }
.table td { padding: 9px 10px; border-bottom: 1px solid var(--graphite); vertical-align: middle; }
.table tr.row { cursor: pointer; }
.table tr.row:hover td { background: var(--graphite-2); }
.table tr.row.sel td { background: rgba(19,226,245,.07); }
.table tr.row.sel td:first-child { box-shadow: inset 3px 0 0 var(--cyan); }
.table tr.off .name { color: var(--bone-dim); text-decoration: line-through; text-decoration-color: rgba(255,46,76,.6); }
.table .name { font-size: 15px; }
.table td.num { text-align: right; color: var(--bone-dim); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; margin: 1px 3px 1px 0; border: 1px solid var(--graphite); color: var(--bone-dim); }
.src { font-size: 12px; padding: 2px 7px; }
.src.vortex { color: var(--black); background: var(--cyan); }
.src.mo2 { color: var(--cyan); border: 1px solid var(--cyan); }
.src.loose { color: var(--bone-dim); border: 1px solid var(--graphite); }
.upd { color: var(--black); background: var(--yellow); font-size: 12px; padding: 2px 7px; }
.empty { padding: 50px 20px; text-align: center; color: var(--bone-dim); }
.empty b { display: block; color: var(--bone); font-size: 17px; margin-bottom: 6px; font-weight: 600; }

#bulkHost { position: sticky; bottom: -24px; z-index: 2; }
.bulk { display: flex; align-items: center; gap: 10px; margin: 0 -18px -24px; padding: 12px 18px;
  background: var(--yellow); color: var(--black); }
.bulk .btn { --edge: var(--black); }
.bulk .btn:hover { --edge: var(--black); background-color: rgba(0,0,0,.08); }
.bulk .btn.primary { background: var(--black); color: var(--yellow); }
.bulk b { margin-right: auto; }

/* ---------------------------------------------------------------- drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 92vw); background: var(--black); border-left: 2px solid var(--yellow);
  transform: translateX(105%); transition: transform .18s ease-out; z-index: 20; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer header { padding: 22px 24px 16px; border-bottom: 1px solid var(--graphite); }
.drawer header h3 { margin: 0 34px 6px 0; font-family: var(--font-cond); font-size: 30px; line-height: 1.05; }
.drawer .close { position: absolute; top: 18px; right: 18px; width: 32px; height: 32px; border: 1px solid var(--graphite); background: none; cursor: pointer; font-size: 18px; line-height: 1; }
.drawer .body { overflow: auto; padding: 18px 24px 28px; flex: 1; }
.drawer h4 { margin: 20px 0 8px; font-size: 13px; font-weight: 400; color: var(--bone-dim); }
.files { font-family: var(--mono); font-size: 12px; max-height: 280px; overflow: auto; border: 1px solid var(--graphite); padding: 8px 10px; white-space: pre; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; }
.kv dt { color: var(--bone-dim); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.inline-form { display: flex; gap: 8px; }
.inline-form input { flex: 1; }
.note { border-left: 3px solid var(--cyan); padding: 8px 12px; background: rgba(19,226,245,.06); margin: 12px 0; }
.note.warn { border-color: var(--red); background: rgba(255,46,76,.07); }

/* ---------------------------------------------------------------- core */
.core-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.core { border: 1px solid var(--graphite); background: var(--surface); padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.core.missing { border-color: var(--red); background: repeating-linear-gradient(135deg, transparent 0 9px, rgba(255,46,76,.07) 9px 10px); }
.core h3 { margin: 0; font-size: 17px; font-weight: 600; }
.core .state { font-size: 12px; align-self: start; padding: 2px 8px; background: var(--bone); color: var(--black); }
.core.missing .state { background: var(--red); }
.core.disabledc .state { background: var(--graphite); color: var(--bone); }
.core p { grid-column: 1 / -1; margin: 2px 0 8px; color: var(--bone-dim); font-size: 13px; }
.core .ver { font-family: var(--font-cond); font-size: 22px; }
.core .ver small { font-family: var(--font); font-size: 12px; color: var(--bone-dim); margin-left: 6px; }
.core .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- logs */
.logs { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; height: 100%; }
.loglist { display: flex; flex-direction: column; gap: 2px; }
.loglist button { text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 9px 12px; cursor: pointer; }
.loglist button:hover { background: var(--graphite-2); }
.loglist button.on { border-left-color: var(--yellow); background: var(--graphite-2); }
.loglist small { display: block; color: var(--bone-dim); font-size: 12px; }
.loglist .e { color: var(--red); }
.loglist .w { color: var(--yellow-deep); }
.viewer { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--graphite); background: var(--surface); }
.viewer .vt { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--graphite); flex-wrap: wrap; }

.viewer pre div::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 46px; text-align: right; color: #55565c; }
.viewer pre div.error { background: rgba(255,46,76,.12); color: #FFB3BF; }
.viewer pre div.warning { background: rgba(252,238,10,.06); color: #F4EC9A; }
.page.fill { display: flex; flex-direction: column; }

/* ---------------------------------------------------------------- nexus */
.user { display: flex; align-items: center; gap: 14px; }

.user b { font-size: 20px; display: block; }
.pill { font-size: 12px; padding: 2px 8px; border: 1px solid var(--yellow); color: var(--yellow); }
.updates { list-style: none; margin: 0; padding: 0; }
.updates li { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--graphite); }
.updates img { width: 64px; height: 40px; object-fit: cover; background: var(--graphite-2); }
.updates .v { color: var(--bone-dim); font-size: 13px; }
.updates .v b { color: var(--yellow); font-weight: 400; }

/* ---------------------------------------------------------------- settings */
.field { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 10px 20px; align-items: center; padding: 12px 0; border-top: 1px solid var(--graphite); }
.field:first-of-type { border-top: 0; }
.field > label { color: var(--bone-dim); }
.field .path { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.field select { max-width: 520px; }
.field .stack { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

/* ---------------------------------------------------------------- status bar, toasts, modal */
.status { grid-column: 1 / -1; display: flex; gap: 22px; align-items: center; padding: 6px 18px; font-size: 12px; color: var(--bone-dim); border-top: 1px solid var(--graphite); }
.status .grow { flex: 1; }
.status .live { color: var(--cyan); }
.status .live::before { content: ""; display: inline-block; width: 7px; height: 7px; background: var(--cyan); margin-right: 6px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }

.toasts { position: fixed; right: 20px; bottom: 44px; display: flex; flex-direction: column; gap: 8px; z-index: 40; width: min(420px, 90vw); }
.toast { background: var(--bone); color: var(--black); padding: 11px 14px 11px 16px; border-left: 6px solid var(--cyan);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
.toast.bad { border-left-color: var(--red); }
.toast.ok { border-left-color: var(--black); background: var(--yellow); }
.toast ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.toast .prog { height: 4px; background: rgba(0,0,0,.15); margin-top: 8px; }
.toast .prog i { display: block; height: 100%; background: var(--black); width: 0; transition: width .15s; }
.toast .tmsg { font-size: 12px; opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast .btn { --edge: var(--black); margin-top: 8px; }

.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: grid; place-items: center; z-index: 30; }
.modal { --edge: var(--yellow); width: min(520px, 92vw); background: linear-gradient(to top right, transparent calc(50% - 1px), var(--edge) calc(50% - 1px) calc(50% + .5px), transparent calc(50% + .5px)) top right / 22px 22px no-repeat, var(--black); border: 1px solid var(--edge); padding: 22px 24px;
  clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%); }
.modal h3 { margin: 0 0 10px; font-family: var(--font-cond); font-size: 28px; }
.modal .btn-row { justify-content: flex-end; margin-top: 18px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* overview: updates first */
.upd-panel { margin-bottom: 18px; border-color: var(--yellow); }
.upd-panel h2 .hint .link { margin-left: 8px; }
.upd-rows { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 0 18px; align-items: center; }
.upd-rows > * { align-self: stretch; display: flex; align-items: center; min-height: 46px; border-top: 1px solid var(--graphite); }
.upd-rows .n { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upd-rows .n .src { margin-left: 8px; }

.upd-rows .d { color: var(--bone-dim); font-size: 13px; white-space: nowrap; }

.src.fw { color: var(--black); background: var(--bone); }

/* link search (drawer + queue) */
.lsearch { position: relative; }
.lsearch input { width: 100%; }
.lslabel { display: flex; align-items: center; gap: 8px; padding: 0 0 0 10px; background: var(--graphite-2); border: 1px solid var(--graphite); }
.lslabel:focus-within { border-color: var(--yellow); }
.lslabel svg { width: 16px; height: 16px; flex: none; color: var(--bone-dim); }
.lslabel input { border: 0; background: none; flex: 1; padding-left: 0; }
.lres-head { margin: 8px 0 4px; }
.lresults { border: 1px solid var(--graphite); max-height: 300px; overflow: auto; }
.lrow { display: flex; gap: 10px; align-items: center; padding: 6px 8px 6px 10px; border-top: 1px solid var(--graphite); cursor: pointer; }
.lrow:first-child { border-top: 0; }
.lrow:hover, .lrow:focus-visible { background: var(--graphite-2); }

.trk { font-size: 12px; color: var(--cyan); margin-left: 6px; }

.status #appVersion { color: var(--bone-dim); }
.src.github { color: var(--black); background: var(--bone); }

/* side panel: Nexus hero + link boxes */
.hero { margin: 0 0 16px; border: 1px solid var(--graphite); background: var(--surface); }
.hero img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--graphite-2); }
.hero img.adult { filter: blur(18px); }
.hero-body { padding: 12px 14px 14px; }
.hero-body b { display: block; font-size: 17px; margin-bottom: 2px; }
.hero-body p { margin: 8px 0 0; color: var(--bone); font-size: 13.5px; }
.small { font-size: 12.5px; }
.linkbox { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; margin-bottom: 10px;
  border: 1px solid var(--graphite); border-left: 3px solid var(--cyan); background: var(--surface); }
.linkbox .btn-row { flex-wrap: nowrap; }
details > summary { cursor: pointer; margin: 10px 0 6px; }
.link.plain { color: inherit; text-decoration: none; font: inherit; }

/* browse */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { --edge: var(--graphite); position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; cursor: pointer;
  background: var(--surface); border: 1px solid var(--edge); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
.card:hover, .card:focus-visible { --edge: var(--yellow); }
/* corner line drawn above the picture, which would otherwise cover it */
.card::after { content: ""; position: absolute; top: 0; right: 0; width: 14px; height: 14px; z-index: 2; pointer-events: none;
  background: linear-gradient(to top right, transparent calc(50% - 1px), var(--edge) calc(50% - 1px) calc(50% + .5px), transparent calc(50% + .5px)); }
.card .thumb { position: relative; display: block; aspect-ratio: 16 / 9; background: var(--graphite-2); overflow: hidden; }
.card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .thumb img.adult { filter: blur(18px); }
.card .badge { position: absolute; left: 8px; top: 8px; background: var(--cyan); color: var(--black); font-size: 12px; padding: 2px 7px; }

.card .meta { color: var(--yellow-deep); margin-top: 4px; }
.flist .frow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--graphite); }
.flist .fdesc { margin-top: 3px; }
.more-row { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 18px 0 4px; }

/* footer: live log error notice */
#sbRun { display: flex; gap: 22px; align-items: center; }
.sb-alert { background: none; border: 0; padding: 0; cursor: pointer; color: var(--red); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.sb-alert:hover { color: #FF7A8F; }

/* startup screen: shown until the logo, avatar and mod list are ready */
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background:
  repeating-linear-gradient(-55deg, rgba(255,255,255,.022) 0 70px, transparent 70px 170px), var(--black); transition: opacity .25s; }
#splash.done { opacity: 0; pointer-events: none; }
.splash-card { width: min(460px, 82vw); padding: 30px 34px 22px; background: var(--slab); color: #fff;
  clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 26px 100%, 0 calc(100% - 26px)); }
.splash-logo { width: 100%; }
.splash-logo .mark { max-height: none; }
.splash-logo .tool { font-size: 22px; }
.splash-logo.text-only .tool { font-size: 34px; text-align: center; letter-spacing: .14em; }
.splash-title { font-family: var(--font-cond); font-weight: 700; font-size: 34px; text-transform: uppercase; letter-spacing: .14em; }
.splash-bar { height: 6px; margin: 16px 0 10px; background: rgba(255,255,255,.14); overflow: hidden; }
.splash-bar i { display: block; height: 100%; width: 35%; background: #fff; animation: splash 1.1s ease-in-out infinite; }
@keyframes splash { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
.splash-msg { font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .splash-bar i { animation: none; width: 100%; } }

/* conflict choice + mod backups */
.choice-list { display: grid; gap: 8px; margin: 6px 0 4px; }
.choice { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--graphite); cursor: pointer; }
.choice:has(input:checked) { border-color: var(--yellow); background: rgba(252,238,10,.05); }
.choice input { margin-top: 3px; accent-color: var(--yellow); }
.choice em { display: block; font-style: normal; color: var(--bone-dim); font-size: 12.5px; margin-top: 2px; }
.modal.wide-bk { width: min(760px, 94vw); }
.bk-sched { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bk-sched select { width: auto; }
.bk-help { flex-basis: 100%; }
.modal.wide-bk .field { grid-template-columns: 150px minmax(0, 1fr); }
.bk-folder { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bk-folder code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bk-list { max-height: 260px; overflow: auto; margin: 6px 0 4px; }
.bk-list td { vertical-align: middle; }
.sub-h { margin: 22px 0 6px; padding-top: 16px; border-top: 1px solid var(--graphite); font-size: 15px; font-weight: 600; }
#setBackups .bk-list { max-height: 320px; }

/* demo-only additions */
.demo-banner { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 12px;
  padding: 5px 8px 5px 14px; background: var(--cyan); color: var(--black); font-size: 12.5px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 10px 100%); }
.demo-banner .btn { --edge: var(--black); color: var(--black); padding: 2px 10px; }
.demo-banner span { opacity: .8; }
.tour { position: fixed; left: 250px; bottom: 44px; z-index: 70; width: min(440px, calc(100vw - 280px)); padding: 16px 18px 14px;
  background: var(--black); border: 1px solid var(--yellow); box-shadow: 0 0 0 1px #000, 0 18px 40px rgba(0,0,0,.6);
  clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); display: none; }
.tour.on { display: block; }
.tour h3 { margin: 2px 0 6px; font-family: var(--font-cond); font-size: 24px; color: var(--yellow); }
.tour p { margin: 0 0 12px; font-size: 14px; line-height: 1.5; }
.tour-step { font-size: 12px; color: var(--bone-dim); }
.tour-hl { outline: 2px solid var(--cyan) !important; outline-offset: 3px; animation: tourpulse 1.4s ease-in-out infinite; position: relative; z-index: 5; }
@keyframes tourpulse { 50% { outline-color: rgba(19,226,245,.25); } }
@media (prefers-reduced-motion: reduce) { .tour-hl { animation: none; } }
.modal.wide { width: min(940px, calc(100vw - 520px)); margin-left: 470px; }
.modal-back:has(.modal.wide) { align-items: start; justify-items: start; padding: 50px 30px 0 0; }

.demo-report mark { background: rgba(255,46,76,.22); color: #FFC2CC; }

</style>

<body>

(() => {

  const C = (location, name, paths, is_dir = true, disabled = false) => ({ location, name, is_dir, disabled, paths });
  const mods = [
    { key: "loose:neonnightsweather", name: "NeonNightsWeather", nexus_id: 90011, version: "3.2.0", enabled: true,
      components: [C("archive", "NeonNightsWeather", ["archive/pc/mod/NeonNightsWeather.archive", "archive/pc/mod/NeonNightsWeather.archive.xl"], false), C("tweak", "NeonNightsWeather", ["r6/tweaks/NeonNightsWeather"])],
      size: 412e6, link: { mod_id: 90011, name: "Neon Nights Weather Overhaul", method: "in_files" }, tracked: true },
    { key: "loose:minimalhud", name: "MinimalHUD", nexus_id: 90022, version: "1.4.1", enabled: true,
      components: [C("redscript", "MinimalHUD", ["r6/scripts/MinimalHUD/HUDCore.reds", "r6/scripts/MinimalHUD/HUDConfig.reds"], false), C("archive", "MinimalHUD", ["archive/pc/mod/MinimalHUD.archive"], false)],

<script>
/* Cyberpunk 2077 Mod List Tool — frontend. Talks to Python via window.pywebview.api. */
"use strict";

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* Python bridge. pywebview fills window.pywebview.api in a background thread after each page
   load, so a call can land while a function isn't there yet. Wait for it, and fall back to the
   single rpc() dispatcher if it still isn't exposed. */
const bridgeReady = () => new Promise((res) => {
  if (window.pywebview?.api?.rpc) return res();
  const t = setTimeout(res, 4000);
  window.addEventListener("pywebviewready", () => { clearTimeout(t); res(); }, { once: true });
});
const call = async (name, ...args) => {
  try {
    let api = window.pywebview?.api;
    if (!api || typeof api[name] !== "function") {
      await bridgeReady();
      for (let i = 0; i < 20 && typeof window.pywebview?.api?.[name] !== "function" && typeof window.pywebview?.api?.rpc !== "function"; i++)
        await new Promise((r) => setTimeout(r, 100));
      api = window.pywebview?.api;
    }
    if (api && typeof api[name] === "function") return await api[name](...args);
    if (api && typeof api.rpc === "function") return await api.rpc(name, args);
    return { ok: false, error: "The app's connection to Python isn't ready. Try again in a moment." };
  } catch (e) { return { ok: false, error: String(e && e.message || e) }; }
};
const fmtSize = (b) => !b ? "" : b < 1e6 ? `${Math.max(1, Math.round(b / 1e3))} KB` : b < 1e9 ? `${(b / 1e6).toFixed(1)} MB` : `${(b / 1e9).toFixed(2)} GB`;
const fmtDate = (ts) => ts ? new Date(ts * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const LOC = { archive: "Archive", redmod: "REDmod", cet: "CET", redscript: "Redscript", tweak: "TweakXL", red4ext: "RED4ext", input: "Input", asi: "ASI" };
const SRC = { loose: "Manual", vortex: "Vortex", mo2: "MO2", github: "GitHub" };

const S = {
  boot: null, page: "overview", status: {}, mods: [], summary: {}, sel: new Set(),
  filter: { q: "", state: "all", source: "all", locs: new Set() }, sort: { key: "name", dir: 1 },
  logSel: null, errorsOnly: false, drawerKey: null, lastReport: null, tasks: {},

/* ------------------------------------------------------------------ toasts & tasks */
function toast(html, kind = "", ms = 5000) {
  const t = document.createElement("div");

  if (ms) setTimeout(() => t.remove(), ms);

}
function result(r, okMsg) {
  if (!r) return false;
  if (r.ok === false && r.error) { toast(esc(r.error), "bad", 8000); return false; }
  const issues = [...(r.errors || [])];
  if (issues.length) toast(`<b>Finished with problems</b><ul>${issues.slice(0, 6).map((e) => `<li>${esc(e)}</li>`).join("")}</ul>`, "bad", 12000);
  (r.notes || []).forEach((n) => toast(esc(n), "", 9000));
  if (r.note) toast(esc(r.note), "", 9000);
  if (okMsg && !issues.length && r.ok !== false) toast(esc(okMsg), "ok", 3500);
  return r.ok !== false;
}
const TASK_LABEL = { export: "Exporting preset", install: "Installing archive", backup: "Backing up mods", restore: "Restoring backup", identify: "Identifying mods on Nexus",
  updates: "Checking for updates", update: "Updating mod", "track-all": "Tracking mods on Nexus", "nexus-sso": "Logging in to Nexus" };
const taskDone = {};

const silentTasks = new Set();  // progress shown in-page instead of a toast
function startTask(r, onDone, silent = false) {
  if (silent && r && r.task) silentTasks.add(r.task);
  if (!r || r.ok === false) { result(r); return; }
  if (!r.task) return;
  taskDone[r.task] = onDone;
  activeTasks.add(r.task);
  window.cp.onTask({ id: r.task, name: r.name || "", progress: 0, message: "", done: false });
  if (!taskPoller) taskPoller = setInterval(pollTasks, 400);
}
async function pollTasks() {
  for (const id of [...activeTasks]) {
    const t = await call("get_task", id);
    if (t && t.ok === false) { activeTasks.delete(id); continue; }
    if (t) window.cp.onTask(t);
  }
  if (!activeTasks.size) { clearInterval(taskPoller); taskPoller = null; }
}
const taskListeners = new Set();
window.cp = {
  onTask(t) {
    if (finishedTasks.has(t.id)) return;  // a late push after the poller already finished it
    taskListeners.forEach((fn) => fn(t));
    if (silentTasks.has(t.id)) {
      if (t.done) {
        finishedTasks.add(t.id); activeTasks.delete(t.id); silentTasks.delete(t.id);
        if (t.error) toast(esc(t.error), "bad", 9000);
        const cb = taskDone[t.id]; delete taskDone[t.id];
        if (cb && !t.error) cb(t.result || {});
      }
      return;
    }
    let el = S.tasks[t.id];
    if (!el) {
      el = S.tasks[t.id] = toast(`<b>${esc(TASK_LABEL[t.name] || "Working")}</b><div class="tmsg"></div><div class="prog"><i></i></div>
        <button class="btn small">Cancel</button>`, "", 0);
      $("button", el).onclick = () => call("cancel_task", t.id);
    }
    if (t.name && TASK_LABEL[t.name]) $("b", el).textContent = TASK_LABEL[t.name];
    $(".tmsg", el).textContent = t.message || "";
    $(".prog i", el).style.width = `${Math.round((t.progress || 0) * 100)}%`;
    if (t.done) {
      finishedTasks.add(t.id); activeTasks.delete(t.id);
      el.remove(); delete S.tasks[t.id];
      if (t.error) toast(esc(t.error), "bad", 9000);
      const cb = taskDone[t.id]; delete taskDone[t.id];
      if (cb && !t.error) cb(t.result || {});
    }
  },
};

/* ------------------------------------------------------------------ modal */
function modal(html, wire, cls = "") {
  const back = $("#modal");
  back.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  back.hidden = false;
  const close = () => { back.hidden = true; back.innerHTML = ""; };
  back.onclick = (e) => { if (e.target === back) close(); };
  $$("[data-close]", back).forEach((b) => (b.onclick = close));
  wire && wire(back, close);
  const f = $("input, .btn.primary", back); f && f.focus();
}
function confirmBox(title, text, okLabel, danger = false) {
  return new Promise((res) => modal(`<h3>${esc(title)}</h3><p>${text}</p><div class="btn-row">
      <button class="btn" data-close>Cancel</button><button class="btn ${danger ? "danger" : "primary"}" id="mOk">${esc(okLabel)}</button></div>`,
    (m, close) => { $("#mOk", m).onclick = () => { close(); res(true); }; m.addEventListener("click", (e) => { if (e.target.hasAttribute("data-close")) res(false); }); }));
}

/* Ask what to do with files that already exist. Resolves true (overwrite), false (keep a copy) or null (cancelled). */
function conflictChoice(title, intro, okLabel) {
  return new Promise((res) => modal(`<h3>${esc(title)}</h3><p>${intro}</p>
    <p class="muted">If a file is already in your game folder:</p>
    <div class="choice-list">
      <label class="choice"><input type="radio" name="cmode" value="keep" checked><span><b>Keep a copy of the old file</b>
        <em>It's moved to Temporarily Disabled Mods\\_Backups (replaced files), so you can roll back.</em></span></label>
      <label class="choice"><input type="radio" name="cmode" value="overwrite"><span><b>Overwrite it</b>
        <em>The old file is replaced and can't be recovered. Uses no extra disk space.</em></span></label>
    </div>
    <div class="btn-row"><button class="btn" data-close>Cancel</button><button class="btn primary" id="cOk">${esc(okLabel)}</button></div>`,
  (m, close) => {
    let done = false;
    $("#cOk", m).onclick = () => { done = true; const v = $("input[name=cmode]:checked", m).value; close(); res(v === "overwrite"); };
    m.addEventListener("click", (e) => { if (!done && (e.target === m || e.target.hasAttribute("data-close"))) res(null); });
  }));
}

/* ------------------------------------------------------------------ mod backups */
async function save(vals) { const r = await call("save_settings", vals); if (r && r.ok) S.boot.settings = r.settings; return r; }
const fmtWhen = (ts) => ts ? `${fmtDate(ts)}, ${new Date(ts * 1000).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}` : "";
function backupReadout() {
  const b = S.backup;
  if (!b) return "Checking…";
  if (b.running) return "Backing up now…";
  return b.last ? `${fmtDate(b.last)} (${ago(b.last)})` : "Never";
}
function renderBackupReadout() { const d = $("#ovBackup"); if (d) d.textContent = backupReadout(); }
function backupsView(d) {
  const rows = d.backups.map((b) => `<tr>
      <td>${esc(fmtWhen(b.created))}</td><td><span class="src ${b.kind === "scheduled" ? "vortex" : "loose"}">${b.kind === "scheduled" ? "Scheduled" : "Manual"}</span></td>
      <td>${b.mods ? plural(b.mods, "mod") : "—"}</td><td class="num">${fmtSize(b.size)}</td>

      <span>keep the newest</span><select id="bkKeep">${[3, 5, 10, 20].map((n) => `<option value="${n}" ${n === d.keep ? "selected" : ""}>${n}</option>`).join("")}</select>
      <span class="muted small bk-help">Runs while this tool is open and the game isn't running. If a backup is due when you open the tool, it runs then. Older scheduled backups are deleted past the limit; manual backups are always kept.</span></div></div>
    <div class="field"><label>Saved in</label><div class="bk-folder"><code title="${esc(d.folder)}">${esc(d.folder)}</code>
      <button class="btn small" id="bkOpenDir">Open folder</button><button class="btn small" id="bkDir">Change</button>${d.custom_folder ? `<button class="btn small" id="bkDefault">Use default</button>` : ""}</div></div>
    ${d.backups.length ? `<div class="bk-list"><table class="table"><thead><tr><th>Created</th><th>Type</th><th>Contents</th><th class="num">Size</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`

/* Wire a rendered backupsView. `leave` runs before an action that opens another dialog; `again` re-renders the view. */
function wireBackups(root, d, again, leave = () => {}) {
  $("#bkSched", root).value = d.schedule;
  $("#bkSched", root).onchange = async (e) => { await save({ backup_schedule: e.target.value }); toast(e.target.value === "off" ? "Automatic backups are off." : `Mods will be backed up ${e.target.value}.`, "ok", 2500); poll(); };
  $("#bkKeep", root).onchange = (e) => save({ backup_keep: +e.target.value });

  $("#bkDir", root).onclick = async () => { const r = await call("mod_backup_browse_dir"); if (r.ok) again(); };
  const def = $("#bkDefault", root); if (def) def.onclick = async () => { await call("mod_backup_reset_dir"); again(); };

  if (now) now.onclick = async () => { leave(); startTask(await call("mod_backup_create", "manual"), async (res) => { await backupDone(res); if (S.page === "settings") again(); }); };
  $$("[data-restore]", root).forEach((b) => (b.onclick = async () => {
    const path = b.dataset.restore; leave();
    const ow = await conflictChoice("Restore this backup?", "Every file in the backup goes back where it was. Mods you installed after the backup stay installed.", "Restore");
    if (ow === null) return again();
    startTask(await call("mod_backup_restore", path, ow), async (res) => {
      toast(`Restored ${plural(res.restored, "file")}.${res.replaced ? ` ${plural(res.replaced, "existing file")} ${res.overwrite ? "overwritten" : "kept in _Backups (replaced files)"}.` : ""}`, "ok", 7000);

async function openBackups() {

/* ------------------------------------------------------------------ chrome */
const PAGES = {

/* Header logo: the PNG is light artwork on a dark card. Measure it instead of assuming a layout:
   trim to the bright artwork, split it into horizontal bands, and if the bottom band is a short
   subtitle line (the small "MOD LIST TOOL"), crop it off and show our larger live text instead.
   Brightness becomes alpha, and the result is used as a CSS mask so it prints black on yellow. */
function applyLogo(cached) {
  for (const box of [$("#slabLogo"), $("#splashLogo")]) {
    if (!box) continue;
    box.style.setProperty("--logo", `url(${cached.mask})`);
    box.style.setProperty("--logo-ratio", cached.ratio);

async function loadLogo() {
  const box = $("#slabLogo");
  const r = await call("app_logo");
  if (!r.ok || !r.uri) { box.classList.add("text-only"); return; }
  const cacheKey = "cp77mlt.logo." + r.uri.length + "." + r.uri.slice(-40);
  try {   // processed logo from last launch: show it instantly
    const hit = JSON.parse(localStorage.getItem(cacheKey) || "null");
    if (hit && hit.mask) { applyLogo(hit); return; }
  } catch (e) { /* storage unavailable */ }
  await new Promise((done) => {
  const img = new Image();
  img.onload = () => {
    const W = img.naturalWidth, H = img.naturalHeight;
    const src = document.createElement("canvas");
    src.width = W; src.height = H;
    const sctx = src.getContext("2d");
    sctx.drawImage(img, 0, 0);
    const all = sctx.getImageData(0, 0, W, H).data;
    // background = median corner brightness; artwork = clearly brighter than that
    const lumAt = (x, y) => { const i = (y * W + x) * 4; return Math.max(all[i], all[i + 1], all[i + 2]) * (all[i + 3] / 255); };
    const corners = [lumAt(0, 0), lumAt(W - 1, 0), lumAt(0, H - 1), lumAt(W - 1, H - 1)].sort((a, b) => a - b);
    const bg = (corners[1] + corners[2]) / 2, thr = bg + 50;
    const rows = new Array(H).fill(0);
    let x0 = W, x1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (lumAt(x, y) > thr) { rows[y]++; if (x < x0) x0 = x; if (x > x1) x1 = x; }
    const bands = [];
    for (let y = 0, start = -1, gap = 0; y <= H; y++) {
      const on = y < H && rows[y] > 0;
      if (on) { if (start < 0) start = y; gap = 0; }
      else if (start >= 0 && (++gap >= 2 || y === H)) { bands.push([start, y - gap]); start = -1; gap = 0; }
    }
    if (!bands.length || x1 < 0) { box.classList.add("text-only"); done(); return; }
    const top = bands[0][0], total = bands[bands.length - 1][1] - top + 1;
    let bottom = bands[bands.length - 1][1], hasSub = false;
    const last = bands[bands.length - 1];
    if (bands.length >= 2 && (last[1] - last[0] + 1) < total * 0.22) { bottom = bands[bands.length - 2][1]; hasSub = true; }
    // recompute horizontal extent for the kept rows only
    x0 = W; x1 = -1;
    for (let y = top; y <= bottom; y++) for (let x = 0; x < W; x++) if (lumAt(x, y) > thr) { if (x < x0) x0 = x; if (x > x1) x1 = x; }
    const pad = 2, cx = Math.max(0, x0 - pad), cy = Math.max(0, top - pad);
    const cw = Math.min(W, x1 + pad + 1) - cx, ch = Math.min(H, bottom + pad + 1) - cy;
    const c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    const ctx = c.getContext("2d");
    const out = ctx.createImageData(cw, ch), o = out.data;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const l = lumAt(cx + x, cy + y), i = (y * cw + x) * 4;
      o[i] = o[i + 1] = o[i + 2] = 0;
      o[i + 3] = Math.max(0, Math.min(255, (l - bg - 20) * 255 / 150));
    }
    ctx.putImageData(out, 0, 0);
    const result = { mask: c.toDataURL("image/png"), ratio: `${cw} / ${ch}`, noSub: !hasSub && cw / ch < 3.8 };
    applyLogo(result);
    try { localStorage.setItem(cacheKey, JSON.stringify(result)); } catch (e) { /* storage full/unavailable */ }
    done();
    // If a subtitle band was cropped off, print ours. If not, the artwork either has no subtitle (a wide
    // wordmark, ~4:1) or one touching the "2077" line (taller than ~3.8:1): then keep the image's own.
  };
  img.onerror = () => { box.classList.add("text-only"); done(); };

  });
}

function visibleMods() {
  const f = S.filter, q = f.q.trim().toLowerCase();
  let list = S.mods.filter((m) => {
    if (f.state === "enabled" && !m.enabled) return false;
    if (f.state === "disabled" && m.enabled) return false;
    if (f.state === "updates" && !(m.update && m.update.update && m.enabled)) return false;
    if (f.state === "unlinked" && (m.nexus_id || m.github || m.source === "mo2")) return false;
    if (f.source !== "all" && m.source !== f.source) return false;
    if (f.locs.size && !m.locations.some((l) => f.locs.has(l))) return false;
    if (q) {
      const hay = [m.name, m.nexus_id, m.link?.name, ...m.components.flatMap((c) => c.paths), ...(m.files || [])].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const k = S.sort.key, d = S.sort.dir;
  const val = (m) => k === "size" ? m.size : k === "nexus" ? (m.update?.update ? 0 : m.nexus_id ? 1 : 2) : String(k === "source" ? SRC[m.source] : m[k] || "").toLowerCase();

}

  if (!result(r)) return;
  const manualOk = ["EquipmentEx", "Redscript", "Cyber Engine Tweaks"];
  el.innerHTML = `<div class="core-list">${r.core.map((c) => `
    <div class="core ${c.installed ? "" : c.disabled ? "disabledc missing" : "missing"}">
      <h3>${esc(c.name)}</h3><span class="state">${c.installed ? "Installed" : c.disabled ? "Disabled" : "Missing"}</span>
      <p>${esc(c.desc)}</p>
      <div class="ver">${esc(c.version || (c.installed ? "Version unknown" : "—"))}${c.version_source === "manual" ? "<small>entered by you</small>" : ""}
        ${c.update?.update ? `<small style="color:var(--yellow)">${esc(c.update.latest)} available</small>` : ""}</div>
      <div></div>
      <div class="acts">
        ${c.update?.update ? `<button class="btn small primary" data-coreupd="${esc(c.name)}">Update to ${esc(c.update.latest)}</button>` : ""}
        <button class="btn small ${c.installed ? "" : "primary"}" data-url="https://www.nexusmods.com/cyberpunk2077/mods/${c.nexus_id}${c.installed ? "" : "?tab=files"}">${c.installed ? "Nexus page" : "Download"}</button>
        ${c.installed && manualOk.includes(c.name) && c.version_source !== "file" ? `<button class="btn small" data-ver="${esc(c.name)}">Set version</button>` : ""}
      </div>
    </div>`).join("")}</div>
    <div class="panel" style="margin-top:18px"><h2>Disable frameworks for testing</h2>
      <p class="muted" style="max-width:75ch;margin-top:-4px">Moving the frameworks out runs the game close to vanilla, which helps you tell whether a crash comes from mods. Most mods stop working until you enable them again.</p>
      <div class="btn-row"><button class="btn danger" id="coreOff">Disable frameworks</button><button class="btn" id="coreOn">Enable frameworks</button></div></div>`;
  wireCommon(el);
  $$("[data-coreupd]", el).forEach((b) => (b.onclick = () => doUpdate(`core:${b.dataset.coreupd}`, () => RENDER.core(el))));
  $$("[data-ver]", el).forEach((b) => (b.onclick = () => modal(`<h3>${esc(b.dataset.ver)} version</h3>
    <p class="muted">This version can't be read from the files, so it comes from you. Find it on the mod's Nexus page or in its download name.</p>
    <input type="text" id="verIn" style="width:100%" placeholder="For example 1.2.7">
    <div class="btn-row"><button class="btn" data-close>Cancel</button><button class="btn primary" id="verOk">Save version</button></div>`, (m, close) => {
    $("#verOk", m).onclick = async () => { await call("set_manual_version", b.dataset.ver, $("#verIn", m).value); close(); RENDER.core(el); };
  })));
  $("#coreOff").onclick = async () => {
    if (await confirmBox("Disable core frameworks?", "RED4ext, Redscript, CET, ArchiveXL, TweakXL, Codeware and EquipmentEx move to <b>Temporarily Disabled Mods</b>.", "Disable frameworks", true)) {
      result(await call("set_core_enabled", false), "Frameworks disabled."); RENDER.core(el); poll();
    }
  };
  $("#coreOn").onclick = async () => { result(await call("set_core_enabled", true), "Frameworks enabled."); RENDER.core(el); poll(); };
};

/* ------------------------------------------------------------------ LOGS */
RENDER.logs = async (el) => {
  const r = await call("get_logs");
  if (!result(r)) return;
  el.classList.add("fill");
  if (!r.logs.length) { el.innerHTML = `<div class="panel"><div class="empty"><b>No logs yet</b>Logs appear after you launch the game with the frameworks installed.</div></div>`; return; }
  if (!S.logSel || !r.logs.some((l) => l.name === S.logSel)) S.logSel = (r.logs.find((l) => l.errors) || r.logs[0]).name;
  el.innerHTML = `<div class="logs"><div class="loglist">${r.logs.map((l) => `<button data-n="${esc(l.name)}" class="${l.name === S.logSel ? "on" : ""}">
      ${esc(l.name)}<small>${esc(l.file)} · ${new Date(l.modified * 1000).toLocaleString()}</small>
      <small>${l.errors ? `<span class="e">${plural(l.errors, "error")}</span> ` : ""}${l.warnings ? `<span class="w">${plural(l.warnings, "warning")}</span>` : ""}${!l.errors && !l.warnings ? "Clean" : ""}</small></button>`).join("")}</div>
    <div class="viewer"><div class="vt"><b id="lvName"></b><span class="grow" style="flex:1"></span>
      <label class="check"><input type="checkbox" id="errOnly" ${S.errorsOnly ? "checked" : ""}>Only errors and warnings</label>
      <button class="btn small" id="lvCopy">Copy</button><button class="btn small" id="lvOpen">Open in editor</button></div><pre id="lvText"></pre></div></div>`;
  $$(".loglist button", el).forEach((b) => (b.onclick = () => { S.logSel = b.dataset.n; RENDER.logs(el); }));
  $("#errOnly").onchange = (e) => { S.errorsOnly = e.target.checked; showLog(); };
  let current = null;
  async function showLog() {
    current = current || await call("read_log", S.logSel);
    if (!result(current)) return;
    $("#lvName").textContent = current.name;
    const lines = S.errorsOnly ? current.lines.filter((l) => l.k) : current.lines;
    const pre = $("#lvText");
    pre.innerHTML = lines.length ? lines.map((l) => `<div class="${l.k || ""}">${esc(l.t) || " "}</div>`).join("") : `<div class="muted">No errors or warnings in this log.</div>`;
    const first = $("div.error", pre); if (first && !S.errorsOnly) first.scrollIntoView({ block: "center" });
  }
  $("#lvOpen").onclick = () => current && call("open_path", current.path);
  $("#lvCopy").onclick = () => current && navigator.clipboard.writeText(current.lines.map((l) => l.t).join("\n")).then(() => toast("Log copied.", "ok", 2000));
  showLog();
};

async function renderTracked() {
  const host = $("#tracked"); if (!host) return;
  const t = await call("nexus_tracked");
  if (!t.ok) { host.textContent = t.error; return; }
  const notTr = t.not_tracked, tr = t.tracked;
  host.className = "";
  host.innerHTML = `${notTr.length ? `<div class="upd-strip" style="margin-bottom:8px"><p>${plural(notTr.length, "linked mod")} ${notTr.length === 1 ? "isn't" : "aren't"} tracked on Nexus yet.</p>
      <button class="btn small primary" id="trkAll">Track ${notTr.length === 1 ? "it" : "all " + notTr.length}</button></div>` : `<p class="muted" style="margin:0 0 8px">Every linked mod is tracked.</p>`}
    <details><summary class="muted" style="cursor:pointer">Tracked on Nexus (${tr.length})</summary>
    ${tr.length ? `<table class="table"><tbody>${tr.map((x) => `<tr><td style="width:90px" class="muted">#${x.mod_id}</td>
      <td>${x.name ? esc(x.name) : `<span class="muted">Mod ${x.mod_id}</span>`}${x.installed ? "" : ` <span class="tag">Not installed</span>`}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn small" data-url="${esc(x.url)}">Open</button> <button class="btn small" data-untrack="${x.mod_id}">Untrack</button></td></tr>`).join("")}</tbody></table>`
      : `<p class="muted">You aren't tracking any Cyberpunk 2077 mods yet.</p>`}</details>`;
  wireCommon(host);
  if ($("#trkAll")) $("#trkAll").onclick = async () => startTask(await call("nexus_track_installed"), (res) => { toast(`Now tracking ${plural(res.tracked, "more mod")}.`, "ok"); refreshMods().then(renderTracked); });
  $$("[data-untrack]", host).forEach((b) => (b.onclick = async () => { if (result(await call("nexus_track", +b.dataset.untrack, false))) b.closest("tr").remove(); }));
}
async function renderQueue() {
  const host = $("#queuePanel"); if (!host) return;
  const sugKeys = new Set(((await call("get_suggestions")).suggestions || []).map((x) => x.key));
  const showDisabled = !!S.boot.settings.queue_include_disabled;
  const q = S.mods.filter((m) => m.source === "loose" && !m.nexus_id && !m.github && !sugKeys.has(m.key) && (showDisabled || m.enabled));
  if (!q.length) { host.hidden = true; return; }
  host.hidden = false;
  const PAGE = 12;
  host.innerHTML = `<h2>Link queue <span class="hint">${plural(q.length, "mod")} not linked</span></h2>
    <p class="muted" style="margin-top:-4px;max-width:80ch">These couldn't be matched automatically. Search Nexus or paste the mod's URL. Each mod you link is checked for updates${S.boot.settings.auto_track ? " and tracked" : ""}.</p>
    <div id="qRows">${q.slice(0, PAGE).map((m) => `<div class="queue-row" data-key="${esc(m.key)}"><div><button class="link plain qname" title="Show files and details"><b>${esc(m.name)}</b></button> ${m.locations.map((l) => `<span class="tag">${LOC[l] || l}</span>`).join("")}${m.enabled ? "" : ` <span class="tag">Disabled</span>`}</div>
      <div class="btn-row"><button class="btn small" data-find>Find on Nexus</button><button class="btn small" data-files>Files</button></div><div class="qs"></div></div>`).join("")}</div>
    ${q.length > PAGE ? `<p class="muted">Showing ${PAGE} of ${q.length}. Linked mods drop off the list. Filter the Mods page by <button class="link" id="qAll">Not linked</button> to see them all.</p>` : ""}`;
  $$(".queue-row", host).forEach((row) => {
    const key = row.dataset.key, m = S.mods.find((x) => x.key === key);
    $("[data-find]", row).onclick = (e) => {
      const host = $(".qs", row), btn = e.currentTarget;
      if (host.childElementCount) { host.innerHTML = ""; btn.textContent = "Find on Nexus"; btn.setAttribute("aria-expanded", "false"); return; }
      mountLinkSearch(host, key, niceName(m.name), () => renderQueue());
      btn.textContent = "Close search"; btn.setAttribute("aria-expanded", "true");
    };
    $("[data-files]", row).onclick = () => openDrawer(key);
    $(".qname", row).onclick = () => openDrawer(key);
  });
  if ($("#qAll")) $("#qAll").onclick = async () => { S.filter.state = "unlinked"; await go("mods"); };
}
